services:
  - type: web
    name: agentreplay-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: STORE_BACKEND
        value: memory
      - key: API_CORS_ORIGINS
        value: "*"

  - type: web
    name: agentreplay-web
    runtime: static
    buildCommand: npm install && npm run build -w @agentreplay/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://agentreplay-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
