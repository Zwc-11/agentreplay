name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check apps/api
      - name: Test
        working-directory: apps/api
        run: pytest

  web-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Test recorder SDK
        run: npm run test -w @agentreplay/recorder-sdk
      - name: Typecheck
        run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web-and-packages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Install web dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Dashboard smoke test
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env file
        run: cp .env.example .env
      - name: Build images
        run: docker compose -f infra/docker-compose.yml build
