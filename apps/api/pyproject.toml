[project]
name = "agentreplay-api"
version = "0.1.0"
description = "AgentReplay backend: ingestion, workflow compiler, agent runner, evaluator."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "playwright>=1.43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
